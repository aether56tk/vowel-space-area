<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vowel Space Area Analyzer</title>
<style>
:root{--bg:#07101d;--card:#0e1a2b;--line:#263650;--text:#edf5ff;--muted:#91a4c0;--a:#67e8f9;--b:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b14,#102039);color:var(--text);font-family:Inter,system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:26px}
h1{margin:0 0 6px;font-size:30px}.sub{color:var(--muted)}header{margin-bottom:20px}
.card{background:#0e1a2bee;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 15px 50px #0005}h2{font-size:18px;margin:0 0 14px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls input,.controls select{background:#07111f;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}
.contexts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.context{border:1px solid var(--line);border-radius:14px;padding:15px;background:#091321}
.context h3{margin:0 0 12px}.table{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;align-items:center}.head{color:var(--muted);font-size:12px;font-weight:700}.vowel{font-weight:800;font-size:17px}.table input{width:100%;padding:9px;background:#07111f;color:var(--text);border:1px solid var(--line);border-radius:8px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));color:#07101c}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button.alt{background:#1b2942;color:var(--text)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#07111f;border:1px solid var(--line);border-radius:12px;padding:13px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:19px;margin-top:5px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.result{border:1px solid var(--line);border-radius:14px;padding:14px;background:#091321}.result h3{margin:0 0 8px}.big{font-size:23px;color:var(--a);font-weight:800}.eq{margin-top:10px;padding:12px;background:#07111f;border:1px solid var(--line);border-radius:10px;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow:auto}.plot{width:100%;height:auto;background:#07111f;border:1px solid var(--line);border-radius:12px}.note{color:var(--muted);font-size:12px;margin-top:9px}
@media(max-width:1000px){.contexts,.results{grid-template-columns:1fr}.controls{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><h1>Quadrilateral Vowel Space Analyzer</h1><div class="sub">F1/F2-only acoustic analysis using /iː/, /æ/, /ɑː/, /uː/ across three speech contexts.</div></header>

<section class="card"><h2>Participant</h2><div class="controls">
<input id="participant" placeholder="Participant ID (optional)">
<select id="group"><option>High proficiency</option><option>Low proficiency</option><option>Not specified</option></select>
</div></section>

<section class="card"><h2>F1 / F2 input</h2><div class="note">Only F1 and F2 are required. Use the same four vowels in the same order for every context.</div><div class="contexts" id="inputs"></div>
<div class="btns"><button onclick="calculate()">Calculate VSA</button><button class="alt" onclick="example()">Load example</button><button class="alt" onclick="clearAll()">Clear</button><button class="alt" onclick="exportCSV()">Export CSV</button></div></section>

<section class="card"><h2>Results</h2><div class="results" id="results"></div></section>

<section class="card"><h2>F1–F2 diagrams</h2><div class="contexts" id="charts"></div></section>

<section class="card"><h2>Context comparison</h2><div class="summary" id="comparison"></div></section>
</main>
<script>
const contexts=[["isolated","Isolated words"],["carrier","Carrier phrase"],["proposed","Proposed sentences"]];
const vowels=[["i","/iː/"],["ae","/æ/"],["a","/ɑː/"],["u","/uː/"]];
document.getElementById("inputs").innerHTML=contexts.map(function(c){return '<div class="context"><h3>'+c[1]+'</h3><div class="table"><div class="head">Vowel</div><div class="head">F1 (Hz)</div><div class="head">F2 (Hz)</div>'+vowels.map(function(v){return '<div class="vowel">'+v[1]+'</div><input id="'+c[0]+'_'+v[0]+'_f1" type="number" min="0" step="1"><input id="'+c[0]+'_'+v[0]+'_f2" type="number" min="0" step="1">';}).join("")+'</div></div>';}).join("");
function get(id){return vowels.map(function(v){return {key:v[0],name:v[1],f1:+document.getElementById(id+"_"+v[0]+"_f1").value,f2:+document.getElementById(id+"_"+v[0]+"_f2").value};});}
function valid(p){return p.every(function(q){return Number.isFinite(q.f1)&&Number.isFinite(q.f2)&&q.f1>=0&&q.f2>=0;});}
function area(p){var s=0;for(var i=0;i<4;i++){var j=(i+1)%4;s+=p[i].f2*p[j].f1-p[i].f1*p[j].f2;}return Math.abs(s)/2;}
function signed(p){var s=0;for(var i=0;i<4;i++){var j=(i+1)%4;s+=p[i].f2*p[j].f1-p[i].f1*p[j].f2;}return s/2;}
function centroid(p){var A=signed(p),x=0,y=0;for(var i=0;i<4;i++){var j=(i+1)%4,c=p[i].f2*p[j].f1-p[j].f2*p[i].f1;x+=(p[i].f2+p[j].f2)*c;y+=(p[i].f1+p[j].f1)*c;}return {f1:y/(6*A),f2:x/(6*A)};}
function perimeter(p){var s=0;for(var i=0;i<4;i++){var j=(i+1)%4;s+=Math.hypot(p[j].f2-p[i].f2,p[j].f1-p[i].f1);}return s;}
function fcr(p){if(!valid(p))return NaN;return (p[0].f1+p[1].f1+p[2].f1+p[3].f1)/(p[0].f2+p[1].f2+p[2].f2+p[3].f2);}
function equation(p){var t=[];for(var i=0;i<4;i++){var j=(i+1)%4;t.push("("+p[i].f2+"×"+p[j].f1+" − "+p[i].f1+"×"+p[j].f2+")");}return "A = ½ × | Σ(F2ᵢ×F1ᵢ₊₁ − F1ᵢ×F2ᵢ₊₁) |\n= ½ × | "+t.join(" + ")+" |\n= "+area(p).toLocaleString()+" Hz²";}
function draw(id,p){var c=document.getElementById("canvas_"+id),g=c.getContext("2d"),W=c.width,H=c.height;g.clearRect(0,0,W,H);var xs=p.map(function(q){return q.f2;}),ys=p.map(function(q){return q.f1;}),xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys),dx=Math.max(100,(xmax-xmin)*.16),dy=Math.max(80,(ymax-ymin)*.16);xmin-=dx;xmax+=dx;ymin-=dy;ymax+=dy;var X=function(x){return 60+(x-xmin)/(xmax-xmin)*(W-90);},Y=function(y){return 30+(y-ymin)/(ymax-ymin)*(H-80);};g.font="12px system-ui";g.strokeStyle="#21304a";g.fillStyle="#91a4c0";for(var k=0;k<=5;k++){var xx=xmin+(xmax-xmin)*k/5,yy=ymin+(ymax-ymin)*k/5;g.beginPath();g.moveTo(X(xx),30);g.lineTo(X(xx),H-50);g.stroke();g.fillText(Math.round(xx),X(xx)-12,H-30);g.beginPath();g.moveTo(60,Y(yy));g.lineTo(W-30,Y(yy));g.stroke();g.fillText(Math.round(yy),15,Y(yy)+4);}g.beginPath();p.forEach(function(q,i){i?g.lineTo(X(q.f2),Y(q.f1)):g.moveTo(X(q.f2),Y(q.f1));});g.closePath();g.fillStyle="rgba(103,232,249,.15)";g.fill();g.strokeStyle="#67e8f9";g.lineWidth=3;g.stroke();p.forEach(function(q){var x=X(q.f2),y=Y(q.f1);g.fillStyle="#a78bfa";g.beginPath();g.arc(x,y,6,0,Math.PI*2);g.fill();g.fillStyle="#edf5ff";g.font="bold 14px system-ui";g.fillText(q.name,x+9,y-8);});g.fillStyle="#edf5ff";g.font="bold 13px system-ui";g.fillText("F2 (Hz)",W/2-20,H-8);g.save();g.translate(13,H/2+20);g.rotate(-Math.PI/2);g.fillText("F1 (Hz)",0,0);g.restore();}
function calculate(){var out=[],validContexts=[];contexts.forEach(function(c){var p=get(c[0]);if(valid(p)){var a=area(p),cen=centroid(p),per=perimeter(p),fr=fcr(p);out.push('<div class="result"><h3>'+c[1]+'</h3><div class="big">'+a.toLocaleString()+' Hz²</div><div class="note">Perimeter: '+per.toFixed(1)+' Hz<br>Centroid: F1 '+cen.f1.toFixed(1)+' · F2 '+cen.f2.toFixed(1)+'<br>FCR: '+fr.toFixed(4)+'</div><div class="eq">'+equation(p)+'</div></div>');validContexts.push({id:c[0],label:c[1],p:p,a:a});}else out.push('<div class="result"><h3>'+c[1]+'</h3><div class="note">Enter all eight F1/F2 values.</div></div>');});document.getElementById("results").innerHTML=out.join("");document.getElementById("charts").innerHTML=validContexts.map(function(x){return '<div class="context"><h3>'+x.label+'</h3><canvas class="plot" id="canvas_'+x.id+'" width="650" height="480"></canvas></div>';}).join("");validContexts.forEach(function(x){draw(x.id,x.p);});document.getElementById("comparison").innerHTML=validContexts.map(function(x){return '<div class="metric"><small>'+x.label+'</small><strong>'+x.a.toLocaleString()+' Hz²</strong></div>';}).join("");}
function example(){var d={isolated:[[300,2500],[700,1800],[750,1200],[350,900]],carrier:[[320,2450],[680,1780],[730,1180],[360,920]],proposed:[[310,2480],[690,1810],[740,1210],[355,910]]};document.getElementById("participant").value="P01";contexts.forEach(function(c){d[c[0]].forEach(function(q,i){var k=vowels[i][0];document.getElementById(c[0]+"_"+k+"_f1").value=q[0];document.getElementById(c[0]+"_"+k+"_f2").value=q[1];});});calculate();}
function clearAll(){document.querySelectorAll('input[type="number"]').forEach(function(x){x.value="";});document.getElementById("results").innerHTML="";document.getElementById("charts").innerHTML="";document.getElementById("comparison").innerHTML="";}
function exportCSV(){var lines=["Participant,Group,Context,Vowel,F1_Hz,F2_Hz,VSA_Hz2"];contexts.forEach(function(c){var p=get(c[0]);if(valid(p)){var a=area(p);p.forEach(function(q){lines.push([document.getElementById("participant").value||"",document.getElementById("group").value,c[1],q.name,q.f1,q.f2,a].join(","));});}});var b=new Blob([lines.join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(document.getElementById("participant").value||"participant")+"_vsa.csv";a.click();URL.revokeObjectURL(a.href);}
example();
</script></body></html>
